<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Custom node art prefab path for Canvas and World2D</title>
  <desc id="desc">Side-by-side diagram showing an authored prefab assigned to a node type, instantiated under a Canvas or World2D node root, and bound to the resulting map node view.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#9bdcff"/></marker>
    <style>
      .bg { fill: #101827; } .panel { fill: #17263a; stroke: #3e5877; stroke-width: 2; }
      .box { fill: #203752; stroke: #9bdcff; stroke-width: 2; } .result { fill: #173f42; stroke: #7ee7c7; stroke-width: 2; }
      .fallback { fill: #2f3045; stroke: #c5b6ff; stroke-width: 2; } .line { stroke: #9bdcff; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #c5b6ff; stroke-width: 2; stroke-dasharray: 8 6; fill: none; marker-end: url(#arrow); }
      text { font-family: Arial, sans-serif; fill: #f4f8ff; } .title { font-size: 27px; font-weight: 700; }
      .head { font-size: 22px; font-weight: 700; } .label { font-size: 18px; font-weight: 700; }
      .small { font-size: 16px; } .note { font-size: 15px; fill: #cbd8e9; }
    </style>
  </defs>
  <rect class="bg" width="1200" height="700" rx="18"/>
  <text class="title" x="40" y="48">Assigned prefab - factory - bound node view</text>
  <text class="note" x="40" y="76">Original diagram grounded in CanvasMapNodeFactory and WorldMapNodeFactory.</text>
  <rect class="panel" x="30" y="105" width="550" height="555" rx="16"/><rect class="panel" x="620" y="105" width="550" height="555" rx="16"/>
  <text class="head" x="55" y="143">Canvas presentation</text><text class="head" x="645" y="143">World2D presentation</text>
  <rect class="box" x="55" y="170" width="205" height="120" rx="10"/><rect class="box" x="645" y="170" width="205" height="120" rx="10"/>
  <text class="label" x="75" y="200">Canvas Prefab</text><text class="small" x="75" y="228">Authored root</text><text class="small" x="75" y="254">+ optional IMapNodeView</text>
  <text class="label" x="665" y="200">World Prefab</text><text class="small" x="665" y="228">Authored root</text><text class="small" x="665" y="254">+ optional IMapNodeView</text>
  <path class="line" d="M265 230 H335"/><path class="line" d="M855 230 H925"/>
  <rect class="fallback" x="55" y="330" width="205" height="145" rx="10"/><rect class="fallback" x="645" y="330" width="205" height="145" rx="10"/>
  <text class="label" x="75" y="360">Null fallback</text><text class="small" x="75" y="388">RectTransform</text><text class="small" x="75" y="412">CanvasRenderer</text><text class="small" x="75" y="436">MapSurfaceGraphic</text>
  <text class="small" x="75" y="460">+ CanvasMapNodeView</text>
  <text class="label" x="665" y="360">Null fallback</text><text class="small" x="665" y="388">Transform</text><text class="small" x="665" y="412">SpriteRenderer</text><text class="small" x="665" y="436">+ WorldMapNodeView</text>
  <text class="note" x="55" y="314">if field is null</text><text class="note" x="645" y="314">if field is null</text>
  <path class="dash" d="M158 295 V325"/><path class="dash" d="M748 295 V325"/>
  <rect class="result" x="335" y="185" width="205" height="225" rx="10"/><rect class="result" x="925" y="185" width="205" height="225" rx="10"/>
  <text class="label" x="355" y="218">Canvas node root</text><text class="small" x="355" y="250">Parented under</text><text class="small" x="355" y="272">node root</text><text class="small" x="355" y="300">IMapNodeView selected</text><text class="small" x="355" y="328">ApplyStyle(style)</text><text class="small" x="355" y="350">Bind(data)</text><text class="small" x="355" y="376">uGUI surface</text><text class="small" x="355" y="398">label and icon</text>
  <text class="label" x="945" y="218">World2D node root</text><text class="small" x="945" y="250">Parented under</text><text class="small" x="945" y="272">node root</text><text class="small" x="945" y="300">IMapNodeView selected</text><text class="small" x="945" y="328">ApplyStyle(style)</text><text class="small" x="945" y="350">Bind(data)</text><text class="small" x="945" y="376">SpriteRenderer</text><text class="small" x="945" y="398">label and icon</text>
  <path class="line" d="M438 418 V485"/><path class="line" d="M1028 418 V485"/>
  <text class="label" x="355" y="520">Result: styled Canvas</text><text class="label" x="355" y="543">node</text><text class="label" x="945" y="520">Result: styled World2D</text><text class="label" x="945" y="543">node</text>
  <text class="note" x="55" y="624">A missing view component is added at runtime.</text><text class="note" x="645" y="624">Both paths use pooling by type, renderer, and prefab.</text>
</svg>
